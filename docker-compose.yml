services:
  postgres:
    build:
      context: ./infra/postgres
    image: querycraft-postgres:17
    container_name: querycraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      QC_APP_PASSWORD: ${QC_APP_PASSWORD:?set QC_APP_PASSWORD in .env}
      QC_READER_PASSWORD: ${QC_READER_PASSWORD:?set QC_READER_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - querycraft-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d adventureworks"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  querycraft-pgdata:
